name: enigmatrix
description: Enigmatrix - juego de deduccion visual.
publish_to: 'none'
version: 0.9.1+13

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  shared_preferences: ^2.3.0
  flame: ^1.37.0
  flutter_soloud: ^4.1.7
  enigmatrix_engine:
    path: ../tools
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_functions: ^7.0.1
  firebase_app_check: ^0.5.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.8
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#1F2A3A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  # Textos traducibles: gen-l10n genera lib/l10n/app_localizations*.dart a
  # partir de lib/l10n/app_es.arb (ver l10n.yaml). Los archivos generados se
  # versionan para compilar sin pasos extra.
  generate: true
  assets:
    - assets/cases/
    - assets/config/
    - assets/tutorial/
    - assets/sonidos/

  # Tipografias empaquetadas (licencia OFL, ver el OFL.txt de cada carpeta).
  # Baloo 2 y Quicksand son fuentes variables: cada peso apunta al mismo
  # archivo y el codigo fija el eje wght (ver UiFonts en skin_theme.dart).
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/baloo2/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/baloo2/Baloo2-Variable.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 400
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 500
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 600
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 700
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 800
        - asset: assets/fonts/quicksand/Quicksand-Variable.ttf
          weight: 900
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/patrickhand/PatrickHand-Regular.ttf
