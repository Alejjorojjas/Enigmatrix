name: enigmatrix
description: Enigmatrix - juego de deduccion visual. Fase 1 (vertical slice, web local).
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  enigmatrix_engine:
    path: ../tools

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#E9DCBE"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/cases/
    - assets/tutorial/
