# Configuración de gen-l10n (textos traducibles, etapa 4).
# Para agregar un idioma basta un archivo nuevo en lib/l10n (p. ej.
# app_en.arb) y su Locale en supportedLocales; luego `flutter gen-l10n`.
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
nullable-getter: false
