# Murdoku Diario: compilar para iPhone y subir a TestFlight (ADR-0017, sección App Store).
#
# Corre cuando un PR aprobado llega a main (push a main que toque código), o a
# mano con "Run workflow". NO corre en los PR: las máquinas Mac de GitHub
# cuentan 10 veces en un repositorio privado (unas 8 a 10 compilaciones al mes
# con los 2.000 minutos gratis). Las pruebas ya las corre android-play.yml.
#
# Queda apagado hasta que la variable del repositorio IOS_UPLOAD valga "true".
#
# Secretos (Settings > Secrets and variables > Actions), ver
# production/guias/2026-11-09-app-store-github-actions.md:
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64,
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY.
# Firebase (etapa 5A.3): GOOGLE_SERVICE_INFO_PLIST_B64, el GoogleService-Info.plist
# en base64 (el archivo no va a git). Se escribe en app/ios/Runner antes de compilar.
#
# Primero corren las pruebas en Linux (barato); solo si pasan se usa la máquina Mac.

name: iOS a TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "production/**"
      - "**/*.md"
      - "backend/**"
      - "prototipos/**"
      - "app/android/**"
  workflow_dispatch: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.4"
  BUNDLE_ID: com.murdokudiario.app

jobs:
  pruebas:
    name: Pruebas (motor y app)
    # Antes de compilar para iPhone se corren las mismas pruebas que en Android:
    # nada llega a TestFlight si alguna falla (11-11-2026).
    if: vars.IOS_UPLOAD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (fijada por SHA)
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fuentes Material del SDK
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          FONTS="$SDK/bin/cache/artifacts/material_fonts"
          if [ ! -f "$FONTS/Roboto-Regular.ttf" ]; then
            flutter precache --universal
          fi
          test -f "$FONTS/Roboto-Regular.ttf"

      - name: Motor (tools)
        working-directory: tools
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test

      - name: App
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  testflight:
    name: IPA firmado y TestFlight
    needs: pruebas
    if: vars.IOS_UPLOAD == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          missing=""
          [ -z "$P12" ] && missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -z "$P12_PASSWORD" ] && missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -z "$PROFILE" ] && missing="$missing IOS_PROVISION_PROFILE_BASE64"
          [ -z "$KEY_ID" ] && missing="$missing APPSTORE_API_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing APPSTORE_API_ISSUER_ID"
          [ -z "$API_KEY" ] && missing="$missing APPSTORE_API_PRIVATE_KEY"
          [ -z "$FIREBASE_PLIST" ] && missing="$missing GOOGLE_SERVICE_INFO_PLIST_B64"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos:$missing"
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2 (fijada por SHA)
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Archivo de Firebase (desde el secreto)
        env:
          FIREBASE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -z "$FIREBASE_PLIST" ]; then
            echo "::error::Falta el secreto GOOGLE_SERVICE_INFO_PLIST_B64 (el GoogleService-Info.plist de Firebase en base64). Agrégalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          DEST=app/ios/Runner/GoogleService-Info.plist
          if ! printf '%s' "$FIREBASE_PLIST" | base64 --decode > "$DEST" 2>/dev/null || [ ! -s "$DEST" ]; then
            rm -f "$DEST"
            echo "::error::El secreto GOOGLE_SERVICE_INFO_PLIST_B64 no es un base64 válido o está vacío."
            exit 1
          fi

      - name: Certificado de distribución (llavero temporal)
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/murdoku.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Perfil de aprovisionamiento
        id: profile
        env:
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          if [ "$APPID" != "$TEAM.$BUNDLE_ID" ]; then
            echo "::error::El perfil es para $APPID y debería ser para $TEAM.$BUNDLE_ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Perfil: $NAME · equipo $TEAM"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"

      - name: Firma manual solo para la app (no para los Pods)
        working-directory: app/ios
        run: |
          # Release.xcconfig solo lo usa el target Runner; los Pods no se firman.
          {
            echo ""
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = ${{ steps.profile.outputs.team }}"
            echo "PROVISIONING_PROFILE_SPECIFIER = ${{ steps.profile.outputs.name }}"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
          } >> Flutter/Release.xcconfig
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ steps.profile.outputs.team }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${{ steps.profile.outputs.uuid }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Compilar IPA
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          # CFBundleVersion = 10000 + número de run de este workflow (siempre crece).
          # El número de versión (0.8.1) sale de pubspec.yaml.
          flutter build ipa --release \
            --build-number=$((10000 + ${{ github.run_number }})) \
            --dart-define=ENX_BACKEND=none \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/ios/ipa

      - name: Subir a TestFlight
        working-directory: app
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: murdoku-ipa-${{ github.run_number }}
          path: app/build/ios/ipa/*.ipa
          retention-days: 7

      - name: Borrar llaves del runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/murdoku.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/dist.p12" app/ios/Runner/GoogleService-Info.plist
